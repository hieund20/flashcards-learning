<div class="page">
  <div class="container">
    <div class="learning-mode-selector">
      @for (mode of learningModes; track mode) {
        <button
          mat-stroked-button
          [class.selected]="learningMode() === mode"
          (click)="setLearningMode(mode)"
        >
          {{ mode }}
        </button>
      }
    </div>
    <app-search-bar (searchChanged)="onSearchChanged($event)"> </app-search-bar>

    @if (currentCard(); as card) {
      <app-flashcard [card]="card" [learningMode]="learningMode()">
      </app-flashcard>
    } @else {
      <div class="empty-state">
        <mat-icon>search_off</mat-icon>

        <h2>No flashcards found</h2>

        <p>Try another keyword.</p>
      </div>
    }

    <div class="navigation">
      <button
        mat-stroked-button
        (click)="previous()"
        [disabled]="currentIndex() === 0"
      >
        <mat-icon>arrow_back</mat-icon>
        Previous
      </button>

      <button
        mat-stroked-button
        color="primary"
        (click)="next()"
        [disabled]="currentIndex() === filteredCards().length - 1"
      >
        Next
        <mat-icon>arrow_forward</mat-icon>
      </button>
    </div>
  </div>
</div>
